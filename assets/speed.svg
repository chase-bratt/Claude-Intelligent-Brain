<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="fast" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
  </defs>
  <rect width="960" height="300" rx="18" fill="#0b1020"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#ffffff">Time to answer "what did we decide about…?"</text>
  <text x="40" y="74" font-size="14" fill="#94a3b8">Measured on an Apple-silicon Mac, log scale. Lower is better.</text>
  <g font-size="15" fill="#e2e8f0">
    <text x="40" y="122">Recall server (search itself)</text>
    <text x="40" y="172">recall.py, end to end</text>
    <text x="40" y="222">Cold one-shot search (no server)</text>
  </g>
  <!-- log scale: 1ms at x=330, 10ms=+170, 100ms=+340, 1000ms=+510 -->
  <g stroke="#1e293b"><line x1="330" y1="95" x2="330" y2="240"/><line x1="500" y1="95" x2="500" y2="240"/><line x1="670" y1="95" x2="670" y2="240"/><line x1="840" y1="95" x2="840" y2="240"/></g>
  <rect x="330" y="104" width="119" height="26" rx="6" fill="url(#fast)"/>
  <text x="459" y="123" font-size="15" font-weight="700" fill="#34d399">5 ms</text>
  <rect x="330" y="154" width="294" height="26" rx="6" fill="url(#fast)"/>
  <text x="634" y="173" font-size="15" font-weight="700" fill="#7dd3fc">54 ms</text>
  <rect x="330" y="204" width="430" height="26" rx="6" fill="#475569"/>
  <text x="770" y="223" font-size="15" font-weight="700" fill="#cbd5e1">340 ms</text>
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="330" y="262">1 ms</text><text x="500" y="262">10 ms</text><text x="670" y="262">100 ms</text><text x="840" y="262">1 s</text>
  </g>
  <text x="40" y="286" font-size="13" fill="#94a3b8">The model and every vector stay in memory, so a query is one embedding + one matrix product.</text>
</svg>
